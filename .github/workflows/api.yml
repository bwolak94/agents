name: API Backend CI

on:
  push:
    branches: [main, feature/**]
    paths:
      - "api/**"
      - "core/**"
      - "agents/**"
      - "tools/**"
      - "llm/**"
      - "db/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "core/**"
      - "agents/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python3 -m pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: python3 -m pytest tests/integration/ -v --tb=short

      # D30 — Coverage delta report posted as PR comment
      - name: Run tests with coverage
        run: |
          python3 -m pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing -q
        continue-on-error: true

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Generate coverage diff report
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} \
            --markdown-report=coverage_diff.md --fail-under=0 || true

      - name: Post coverage diff as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage_diff.md
          header: Coverage Delta

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: agent-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
