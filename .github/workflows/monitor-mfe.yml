name: Monitor MFE CI

on:
  push:
    branches: [main, feature/**]
    paths:
      - "web/apps/monitor/**"
      - "web/packages/ui/**"
      - ".github/workflows/monitor-mfe.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/apps/monitor/**"
      - "web/packages/ui/**"

jobs:
  build:
    name: Build Monitor MFE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/apps/monitor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    name: Docker Build Monitor
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build Monitor image
        uses: docker/build-push-action@v5
        with:
          context: web/apps/monitor
          file: web/apps/monitor/Dockerfile
          push: false
          tags: agent-monitor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
