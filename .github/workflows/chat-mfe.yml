name: Chat MFE CI

on:
  push:
    branches: [main, feature/**]
    paths:
      - "web/**"
      - "!web/apps/monitor/**"
      - "!web/apps/workflow/**"
      - ".github/workflows/chat-mfe.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "!web/apps/monitor/**"
      - "!web/apps/workflow/**"

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build Chat MFE image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: docker/Dockerfile.web
          push: false
          tags: agent-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
