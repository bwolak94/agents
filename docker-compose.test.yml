# #21 — End-to-end test environment.
# Usage:
#   docker-compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test-runner
services:
  mongo-test:
    image: mongo:7
    container_name: agent-mongo-test
    ports:
      - "27018:27017"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: agent-api-test
    ports:
      - "8001:8000"
    environment:
      - MONGO_URL=mongodb://mongo-test:27017
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-dummy-key-for-tests}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy-key-for-tests}
      - OLLAMA_URL=http://localhost:11434
      - LOG_LEVEL=WARNING
    depends_on:
      mongo-test:
        condition: service_healthy
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  test-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: agent-test-runner
    environment:
      - API_BASE_URL=http://api-test:8000
      - PYTHONPATH=/app
    depends_on:
      api-test:
        condition: service_healthy
    networks:
      - test-net
    command: >
      sh -c "
        python3 -m pytest tests/e2e/ -v --tb=short --timeout=30 &&
        echo 'E2E tests passed!'
      "

networks:
  test-net:
    driver: bridge
