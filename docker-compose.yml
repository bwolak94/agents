services:
  # ─────────────────────────────────────────
  # API Backend (Python/FastAPI)
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: agent-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080/search
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
    volumes:
      # Mount only source directories, not the entire repo (#26)
      - ./api:/app/api
      - ./core:/app/core
      - ./agents:/app/agents
      - ./tools:/app/tools
      - ./llm:/app/llm
      - ./db:/app/db
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_started
      searxng:
        condition: service_started
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # Web UI (Node.js / Next.js)
  # ─────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: agent-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────
  # Agent Monitor MFE (port 3003)
  # Real-time agent activity dashboard
  # ─────────────────────────────────────────
  monitor:
    build:
      context: ./web/apps/monitor
      dockerfile: Dockerfile
    container_name: agent-monitor
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-net
    profiles:
      - mfe

  # ─────────────────────────────────────────
  # Workflow Builder MFE (port 3004)
  # Drag-and-drop LangGraph workflow editor
  # ─────────────────────────────────────────
  workflow-builder:
    build:
      context: ./web/apps/workflow
      dockerfile: Dockerfile
    container_name: agent-workflow
    ports:
      - "3004:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-net
    profiles:
      - mfe

  # ─────────────────────────────────────────
  # MongoDB - chat history
  # ─────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: agent-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────
  # SearXNG - samohostowana wyszukiwarka
  # Agreguje Google, Bing, DuckDuckGo bez API key
  # ─────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: agent-searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null 2>&1 || curl -sf http://localhost:8080/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    container_name: agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || wget -qO- http://localhost:11434/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Uncomment if you have an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─────────────────────────────────────────
  # Ollama Model Puller (jednorazowy setup)
  # ─────────────────────────────────────────
  ollama-setup:
    image: curlimages/curl:latest
    container_name: agent-ollama-setup
    depends_on:
      ollama:
        condition: service_started
    networks:
      - agent-net
    command: >
      sh -c "
        curl -s http://ollama:11434/api/pull -d '{\"name\":\"llama3\"}' &&
        curl -s http://ollama:11434/api/pull -d '{\"name\":\"mistral\"}' &&
        echo 'Modele pobrane!'
      "
    restart: "no"

volumes:
  ollama-models:
    name: agent-ollama-models
  mongo-data:
    name: agent-mongo-data

networks:
  agent-net:
    driver: bridge
