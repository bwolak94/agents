[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --no-header"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/migrations/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
